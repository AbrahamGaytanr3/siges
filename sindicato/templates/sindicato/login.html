{% extends "sindicato/base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}

  <div class="login-envoltorio">
    <div class="tarjeta login-tarjeta">
      <h2>Iniciar sesión</h2>
      {% if form.errors %}
        <p class="login-error">Usuario o contraseña incorrectos.</p>
      {% endif %}
      <form method="post" action="{% url 'sindicato:login' %}">
        {% csrf_token %}
        <label for="id_username">Usuario</label>
        {{ form.username }}
        <label for="id_password">Contraseña</label>
        {{ form.password }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="enlace-destacado">Entrar</button>
      </form>
    </div>
  </div>

{% endblock %}
